<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to My GitHub Pages Site</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1f2937;
      }
      main {
        text-align: center;
        padding: 2rem;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 640px;
      }
      h1 {
        margin-top: 0;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🚀 GitHub Pages is working!</h1>
      <p>This is a basic homepage for trying out GitHub Pages.</p>
      <p>Edit <code>index.html</code> to customize this site.</p>
      <p><a href="https://pages.github.com/">Learn more about GitHub Pages</a></p>
    </main>
  </body>
</html>
